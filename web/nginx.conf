# Serves the SPA and load-balances /api across every `api` replica
# (Docker DNS returns one address per replica; nginx round-robins them).

# Re-resolve `api` every few seconds, so replicas that are scaled or recreated with new IPs are
# picked up without restarting nginx (`resolve` needs nginx >= 1.27.3 and a shared `zone`).
resolver 127.0.0.11 valid=5s ipv6=off;

# Access log with timings: rt = total time in nginx, urt = time the API took to answer.
log_format timed '$remote_addr [$time_local] "$request" $status rt=$request_time urt=$upstream_response_time';

upstream api {
  zone api 64k;
  server api:3000 resolve;
  # Reuse connections to the API instead of opening one per request. The pool must cover the peak
  # concurrency: with a small pool nginx churns through new TCP connections under load, and the
  # occasional dropped SYN stalls a request for seconds while TCP retries (1s, 3s, 7s, ...).
  keepalive 1024;
  keepalive_requests 100000;
}

server {
  listen 80;
  access_log /var/log/nginx/access.log timed;

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
